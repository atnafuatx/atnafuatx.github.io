---
layout: minimal
---
<p class="post-meta">
  <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
  {%- if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}
</p>

<article class="prose">
{{ content }}
</article>

<p class="more-link"><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>
