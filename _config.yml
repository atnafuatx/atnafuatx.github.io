# Site settings. Restart `jekyll serve` after editing this file.

locale      : "en"
title       : "Atnafu Lambebo Tonja"
description : "Google DeepMind Academic Fellow at University College London, working on NLP for under-resourced languages."
url         : "https://atnafuatx.github.io"
baseurl     : ""
repository  : "atnafuatx/atnafuatx.github.io"
timezone    : Europe/London

author:
  name            : "Atnafu Lambebo Tonja"
  role            : "Google DeepMind Academic Fellow"
  affiliation     : "University College London"
  affiliation_url : "https://www.ucl.ac.uk/"
  location        : "London, UK"
  avatar          : "/images/at.jpg"
  twitter         : "AtnafuLambebo"

# Path to a PDF of the full CV, e.g. "/files/cv.pdf". When set, the CV page
# links to it; when empty, it invites visitors to email instead.
cv_pdf      :

# Profile links live in _data/links.yml, navigation in _data/navigation.yml,
# publications in _data/publications.yml, news in _data/news.yml and talks in
# _data/talks.yml. Blog posts go in _posts/ (see README.md).

# Blog post URLs, e.g. /blog/2026/my-post/
permalink: /blog/:year/:title/

include:
  - _pages
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - .sass-cache

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: minimal
  - scope:
      path: ""
      type: posts
    values:
      layout: post

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
